<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro de Personas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 36px;
      color: white;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    header p {
      margin-top: 6px;
      font-size: 15px;
      opacity: 0.85;
    }

    /* Card */
    .card {
      background: white;
      border-radius: 20px;
      padding: 36px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      margin-bottom: 32px;
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h2::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 4px;
    }

    /* Input group */
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-group .icon {
      position: absolute;
      left: 14px;
      bottom: 12px;
      font-size: 16px;
      pointer-events: none;
    }
    .input-group input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 2px solid #e8e8e8;
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: #1a1a2e;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fafafa;
    }
    .input-group input:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 4px rgba(102,126,234,0.12);
    }
    .input-group input::placeholder { color: #bbb; }

    /* Button */
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
    }
    .btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Mensaje */
    #mensaje {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
      font-weight: 500;
      border-radius: 8px;
      padding: 0;
      transition: all 0.3s;
    }
    #mensaje.ok {
      color: #1b7a3e;
      background: #e8f5e9;
      padding: 10px;
    }
    #mensaje.err {
      color: #b71c1c;
      background: #ffebee;
      padding: 10px;
    }

    /* Tabla card */
    .tabla-card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 720px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .tabla-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .tabla-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tabla-header h2::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 4px;
    }
    .badge {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead tr { background: #f5f6fa; }
    th {
      padding: 12px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    td { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; color: #333; }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.15s; }
    tbody tr:hover td { background: #f8f7ff; }

    .num-cell {
      width: 40px;
      color: #bbb;
      font-weight: 600;
    }

    #cargando {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      padding: 24px 0;
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #ddd;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 32px 0;
      color: #bbb;
      font-size: 14px;
    }
    .empty-state .emoji { font-size: 36px; display: block; margin-bottom: 8px; }
  </style>
</head>
<body>

  <header>
    <h1>📋 Registro de Personas</h1>
    <p>Los datos se guardan directamente en GitHub</p>
  </header>

  <div class="card">
    <h2>Nuevo Registro</h2>

    <div class="input-group">
      <label for="nombre">Nombre</label>
      <span class="icon">👤</span>
      <input type="text" id="nombre" placeholder="Ej: Juan Pérez" autocomplete="off"/>
    </div>

    <div class="input-group">
      <label for="edad">Edad</label>
      <span class="icon">🎂</span>
      <input type="number" id="edad" placeholder="Ej: 25" min="1" max="120"/>
    </div>

    <div class="input-group">
      <label for="telefono">Teléfono</label>
      <span class="icon">📞</span>
      <input type="tel" id="telefono" placeholder="Ej: 555-1234"/>
    </div>

    <button class="btn" id="btnGuardar" onclick="guardar()">Guardar Registro</button>
    <div id="mensaje"></div>
  </div>

  <div class="tabla-card">
    <div class="tabla-header">
      <h2>Lista de Registros</h2>
      <span class="badge" id="conteo">0</span>
    </div>
    <div id="cargando"><span class="spinner"></span> Cargando datos...</div>
    <table id="tabla" style="display:none">
      <thead>
        <tr>
          <th class="num-cell">#</th>
          <th>Nombre</th>
          <th>Edad</th>
          <th>Teléfono</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" class="empty-state" style="display:none">
      <span class="emoji">🗂️</span>
      No hay registros aún
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
