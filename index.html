<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulario de Registro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      min-height: 100vh;
    }
    h1 { margin-bottom: 24px; color: #333; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      margin-bottom: 40px;
    }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #555; font-size: 14px; }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 18px;
      transition: border 0.2s;
    }
    input:focus { outline: none; border-color: #4f8ef7; }
    button {
      width: 100%;
      padding: 12px;
      background: #4f8ef7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #3a7ae0; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #mensaje {
      margin-top: 14px;
      font-size: 14px;
      text-align: center;
      min-height: 20px;
    }
    .ok { color: #2e7d32; }
    .err { color: #c62828; }

    /* Tabla */
    .tabla-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .tabla-card h2 { margin-bottom: 16px; color: #333; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #4f8ef7; color: white; padding: 10px 14px; text-align: left; }
    td { padding: 10px 14px; border-bottom: 1px solid #eee; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f7f9ff; }
    #cargando { color: #888; font-size: 14px; }
  </style>
</head>
<body>

  <h1>Registro de Personas</h1>

  <div class="card">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" placeholder="Ej: Juan Pérez" />

    <label for="edad">Edad</label>
    <input type="number" id="edad" placeholder="Ej: 25" min="1" max="120" />

    <label for="telefono">Teléfono</label>
    <input type="tel" id="telefono" placeholder="Ej: 555-1234" />

    <button id="btnGuardar" onclick="guardar()">Guardar</button>
    <div id="mensaje"></div>
  </div>

  <div class="tabla-card">
    <h2>Lista de Registros</h2>
    <div id="cargando">Cargando datos...</div>
    <table id="tabla" style="display:none">
      <thead>
        <tr>
          <th>#</th>
          <th>Nombre</th>
          <th>Edad</th>
          <th>Teléfono</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
